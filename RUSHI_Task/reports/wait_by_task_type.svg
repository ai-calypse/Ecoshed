<svg xmlns="http://www.w3.org/2000/svg" width="980" height="462" viewBox="0 0 980 462" role="img" aria-labelledby="title desc">
<title id="title">Share of tasks that had to wait, by task type (4,000 groups, HPE curve)</title>
<desc id="desc">A task waits when no server has room, or when its server is still waking up (10 s). Mean waits are in REPORT.md. Balanced tasks (303,807): CPU-oriented LR-MMT 52.8%, LR-MMT + CPU/memory-aware 38.5%; Memory-heavy tasks (73,730): CPU-oriented LR-MMT 41.8%, LR-MMT + CPU/memory-aware 25.2%; CPU-heavy tasks (748): CPU-oriented LR-MMT 12.7%, LR-MMT + CPU/memory-aware 11.8%</desc>
