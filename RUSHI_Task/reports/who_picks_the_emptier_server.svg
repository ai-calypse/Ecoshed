<text x="24.0" y="58.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Share of disagreements where the policy&#x27;s own pick was the less-loaded server (HPE curve).</text>
<rect x="24.0" y="78.0" width="12" height="12" rx="2" fill="#2a78d6"/>
