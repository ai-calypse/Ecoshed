<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
<title id="title">When the two placement rules disagree, which server does each pick?</title>
<desc id="desc">Share of disagreements where the policy&#x27;s own pick was the less-loaded server (HPE curve). 250 groups: CPU-oriented LR-MMT 2%, LR-MMT + CPU/memory-aware (proposed) 40%; 1,000 groups: CPU-oriented LR-MMT 2%, LR-MMT + CPU/memory-aware (proposed) 59%; 4,000 groups: CPU-oriented LR-MMT 17%, LR-MMT + CPU/memory-aware (proposed) 62%</desc>
