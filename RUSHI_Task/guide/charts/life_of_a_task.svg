<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
<title id="title">Life of a task and a server</title>
<desc id="desc">Task: arrives, queues, is placed, runs, finishes. Server: asleep, waking, on, asleep again.</desc>
<rect width="980" height="330" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="24.0" y="30.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The life of a task</text>
<rect x="24" y="44" width="172" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="110.0" y="70.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Task arrives</text>
<text x="110.0" y="87.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">asks for CPU + memory</text>
<rect x="214" y="44" width="172" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="300.0" y="70.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Queue</text>
<text x="300.0" y="87.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">first in, first out</text>
<rect x="404" y="44" width="172" height="56" rx="8" fill="#eef4fc" stroke="#c3c2b7"/>
<text x="490.0" y="70.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Placement</text>
<text x="490.0" y="87.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">picks a server</text>
<rect x="594" y="44" width="172" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="680.0" y="70.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Runs</text>
<text x="680.0" y="87.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">may be migrated</text>
<rect x="784" y="44" width="172" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="870.0" y="70.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Finishes</text>
<text x="870.0" y="87.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">frees its space</text>
<line x1="196" y1="72" x2="210" y2="72" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="386" y1="72" x2="400" y2="72" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="576" y1="72" x2="590" y2="72" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="766" y1="72" x2="780" y2="72" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="24.0" y="150.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The life of a server</text>
<rect x="24" y="166" width="200" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="124.0" y="192.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Asleep</text>
<text x="124.0" y="209.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">5 W</text>
<rect x="390" y="166" width="200" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="490.0" y="192.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Waking up</text>
<text x="490.0" y="209.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">full power for 10 s</text>
<rect x="756" y="166" width="200" height="56" rx="8" fill="#f5f4f0" stroke="#c3c2b7"/>
<text x="856.0" y="192.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">On</text>
<text x="856.0" y="209.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">45 W and up (HPE)</text>
<line x1="224" y1="186" x2="386" y2="186" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="305.0" y="178.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">a task is placed on it</text>
<line x1="590" y1="186" x2="752" y2="186" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="671.0" y="178.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">10 s later</text>
<path d="M856,222 C856,290 124,290 124,226" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="490.0" y="300.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">no work for 60 s: falls asleep</text>
<text x="24.0" y="322.0" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Every 5 minutes the controller checks all servers: it moves tasks off overloaded ones and empties servers under 30% so they can sleep.</text>
</g>
</svg>
