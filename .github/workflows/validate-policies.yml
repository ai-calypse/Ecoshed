name: Validate scheduling policies
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ROHAN_Task/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python -m ROHAN_Task.run --sizes 250 --curves hpe_dl360_gen9 --policies lr_mmt lr_mmt_memory --output /tmp/ecosched-policies
      - run: git diff --exit-code
