name: Validate energy-first study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ENERGY_Study/tests -v
      - run: python -m unittest discover -s RAW_Alibaba/tests -v
      - run: python -m RAW_Alibaba.run --help
      - run: git diff --exit-code
