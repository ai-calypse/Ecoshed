<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Modeled energy on the largest unchanged Alibaba sample</title>
<desc id="desc">Three separate power curves; all ten policies run the identical 378285 task instances. Horizontal bars start at zero. Lower is better.</desc>
<rect width="1200" height="550" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172a3a">
<text x="25" y="30" font-size="22" font-weight="bold">Largest Alibaba sample: 4,000 groups / 378,285 instances</text>
<text x="25" y="53" font-size="14">Modeled energy (kWh), lower is better. Separate simulations per curve; identical workload and 64-host pool.</text>
<text x="25" y="90" font-size="17" font-weight="bold">HPE DL360 Gen9</text>
