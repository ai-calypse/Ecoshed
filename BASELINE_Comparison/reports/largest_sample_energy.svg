<text x="755" y="291" font-size="13">4,000 groups</text><rect x="870" y="273" width="160.1573921871307" height="27" fill="#b53c40"/><text x="1035.1573921871307" y="292" font-size="12">+14.560%</text>
<text x="25" y="390" font-size="13">Energy improves in 4/9 cases; larger workloads show a 10.96–14.56% penalty. This is in-sample simulation evidence.</text>
</g></svg>