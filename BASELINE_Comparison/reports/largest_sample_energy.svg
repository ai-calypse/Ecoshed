<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Proposal: energy change relative to CPU-oriented LR-MMT</title>
<desc id="desc">Only CPU/memory-aware placement changes. Negative percentages save energy; positive percentages consume more. Three sample sizes for each separate server curve.</desc>
<rect width="1120" height="420" fill="white"/><g font-family="Arial, sans-serif" fill="#172a3a">
<text x="25" y="30" font-size="22" font-weight="bold">Proposed placement: energy change versus CPU-oriented LR-MMT</text>
<text x="25" y="55" font-size="14">Same Alibaba samples, 64-host pool and LR/MMT controller. Negative = savings; positive = more energy.</text>
<text x="25" y="95" font-size="17" font-weight="bold">HPE DL360 Gen9</text>
<line x1="140" y1="118" x2="140" y2="320" stroke="#d9e2e9"/><text x="140" y="343" text-anchor="middle" font-size="12">+0%</text>
<line x1="195" y1="118" x2="195" y2="320" stroke="#d9e2e9"/><text x="195" y="343" text-anchor="middle" font-size="12">+5%</text>
<line x1="250" y1="118" x2="250" y2="320" stroke="#d9e2e9"/><text x="250" y="343" text-anchor="middle" font-size="12">+10%</text>
<line x1="305" y1="118" x2="305" y2="320" stroke="#d9e2e9"/><text x="305" y="343" text-anchor="middle" font-size="12">+15%</text>
<text x="25" y="161" font-size="13">250 groups</text><rect x="135.72467107279897" y="143" width="4.275328927201016" height="27" fill="#087f8c"/><text x="145" y="162" font-size="12">-0.389%</text>
<text x="25" y="226" font-size="13">1,000 groups</text><rect x="140" y="208" width="14.7133226972467" height="27" fill="#b53c40"/><text x="159.7133226972467" y="227" font-size="12">+1.338%</text>
<text x="25" y="291" font-size="13">4,000 groups</text><rect x="140" y="273" width="156.19350480749276" height="27" fill="#b53c40"/><text x="301.1935048074928" y="292" font-size="12">+14.199%</text>
<text x="390" y="95" font-size="17" font-weight="bold">Huawei RH2288H V3</text>
<line x1="505" y1="118" x2="505" y2="320" stroke="#d9e2e9"/><text x="505" y="343" text-anchor="middle" font-size="12">+0%</text>
<line x1="560" y1="118" x2="560" y2="320" stroke="#d9e2e9"/><text x="560" y="343" text-anchor="middle" font-size="12">+5%</text>
<line x1="615" y1="118" x2="615" y2="320" stroke="#d9e2e9"/><text x="615" y="343" text-anchor="middle" font-size="12">+10%</text>
<line x1="670" y1="118" x2="670" y2="320" stroke="#d9e2e9"/><text x="670" y="343" text-anchor="middle" font-size="12">+15%</text>
<text x="390" y="161" font-size="13">250 groups</text><rect x="498.55862678772894" y="143" width="6.441373212271051" height="27" fill="#087f8c"/><text x="510" y="162" font-size="12">-0.586%</text>
<text x="390" y="226" font-size="13">1,000 groups</text><rect x="504.37677431902296" y="208" width="0.6232256809770576" height="27" fill="#087f8c"/><text x="510" y="227" font-size="12">-0.057%</text>
<text x="390" y="291" font-size="13">4,000 groups</text><rect x="505" y="273" width="120.56165869685132" height="27" fill="#b53c40"/><text x="630.5616586968513" y="292" font-size="12">+10.960%</text>
<text x="755" y="95" font-size="17" font-weight="bold">QuantaGrid D51B-2U</text>
<line x1="870" y1="118" x2="870" y2="320" stroke="#d9e2e9"/><text x="870" y="343" text-anchor="middle" font-size="12">+0%</text>
<line x1="925" y1="118" x2="925" y2="320" stroke="#d9e2e9"/><text x="925" y="343" text-anchor="middle" font-size="12">+5%</text>
<line x1="980" y1="118" x2="980" y2="320" stroke="#d9e2e9"/><text x="980" y="343" text-anchor="middle" font-size="12">+10%</text>
<line x1="1035" y1="118" x2="1035" y2="320" stroke="#d9e2e9"/><text x="1035" y="343" text-anchor="middle" font-size="12">+15%</text>
<text x="755" y="161" font-size="13">250 groups</text><rect x="864.5499490972389" y="143" width="5.450050902761017" height="27" fill="#087f8c"/><text x="875" y="162" font-size="12">-0.495%</text>
